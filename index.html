<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Church Student App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Styling Library (የቅርጽ እና የጥራት ስሪት) -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsl(225, 100%, 95%) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsl(280, 100%, 95%) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsl(210, 100%, 95%) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsl(0, 100%, 95%) 0px, transparent 50%);
            background-attachment: fixed;
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-900 h-screen w-screen overflow-hidden flex flex-col">

    <div class="flex-1 overflow-y-auto relative w-full no-scrollbar pb-28" id="main-container">
        
        <!-- ============================== -->
        <!-- TAB 1: CLASS VIEWS             -->
        <!-- ============================== -->
        <div id="view-class-root" class="app-view p-5 bg-transparent">
            <h2 class="text-3xl font-bold mb-6 text-gray-800 tracking-tight">Classes</h2>
            <div class="space-y-3" id="class-buttons-container">
                <!-- Buttons injected by JS -->
            </div>
        </div>

        <div id="view-class-list" class="app-view hidden p-5 bg-transparent">
            <div class="flex items-center mb-6">
                <button onclick="showView('class-root')" class="p-2 -ml-2 text-gray-500 hover:text-gray-800 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="class-list-title" class="text-2xl font-bold text-gray-800 ml-2 tracking-tight">Class</h2>
            </div>
            <div id="class-students-container" class="space-y-3">
                <!-- Student list injected by JS -->
            </div>
        </div>

        <div id="view-student-detail" class="app-view hidden p-5 bg-transparent">
            <div class="flex items-center mb-6">
                <button onclick="showView('class-list')" class="p-2 -ml-2 text-gray-500 hover:text-gray-800 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 class="text-2xl font-bold text-gray-800 ml-2 tracking-tight">Student ID</h2>
            </div>
            <div id="student-id-card" class="bg-white/80 backdrop-blur-md border border-white shadow-xl rounded-3xl p-6 flex flex-col items-center">
                <!-- ID Card Content injected by JS -->
            </div>
        </div>

        <!-- ============================== -->
        <!-- TAB 2: ATTENDANCE VIEWS        -->
        <!-- ============================== -->
        <div id="view-attendance-root" class="app-view hidden p-5 bg-transparent">
            <h2 class="text-3xl font-bold mb-6 text-gray-800 tracking-tight">Attendance</h2>
            <div class="space-y-3" id="attendance-buttons-container">
                <!-- Buttons injected by JS -->
            </div>
        </div>

        <div id="view-attendance-list" class="app-view hidden p-5 bg-transparent">
            <div class="flex items-center mb-6">
                <button onclick="showView('attendance-root')" class="p-2 -ml-2 text-gray-500 hover:text-gray-800 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="attendance-list-title" class="text-2xl font-bold text-gray-800 ml-2 tracking-tight">Attendance</h2>
            </div>
            
            <div class="overflow-hidden rounded-2xl border border-white shadow-md bg-white/70 backdrop-blur-md">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50/80">
                        <tr>
                            <th class="py-3 px-4 font-semibold text-gray-700 border-b border-gray-200">Student Name (A-Z)</th>
                            <th class="py-3 px-4 font-semibold text-gray-700 text-center border-b border-gray-200">Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-table-body" class="divide-y divide-gray-200">
                        <!-- Table rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ============================== -->
        <!-- TAB 3: NEW REGISTRATION FORM   -->
        <!-- ============================== -->
        <div id="view-new-root" class="app-view hidden p-5 bg-transparent">
            <h2 class="text-3xl font-bold mb-6 text-gray-800 tracking-tight">Register</h2>
            
            <!-- STEP 1 -->
            <div id="form-step-1" class="space-y-4 fade-in">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-semibold text-gray-400">Step 1 of 2</span>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Church Name</label>
                    <input type="text" id="inp-church" value="St. Mary Orthodox Church" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Christ Name</label>
                    <input type="text" id="inp-christ" value="Gebre Michael" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                        <input type="text" id="inp-first" value="John" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                        <input type="text" id="inp-last" value="Yemilewn" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                </div>
                <button onclick="goToStep(2)" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold py-4 rounded-xl mt-6 active:scale-[0.98] shadow-lg shadow-indigo-500/30 transition-all">
                    Next
                </button>
            </div>

            <!-- STEP 2 -->
            <div id="form-step-2" class="space-y-4 hidden fade-in">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-semibold text-gray-400">Step 2 of 2</span>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                        <input type="number" id="inp-age" value="16" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sex</label>
                        <select id="inp-sex" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="mt-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" id="inp-phone" value="+251 911 234 567" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4 mt-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Emergency Name</label>
                        <input type="text" id="inp-emer-name" value="Yemilewn Tesfaye" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Emer. Phone</label>
                        <input type="tel" id="inp-emer-phone" value="+251 922 987 654" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                </div>
                
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Profile Picture</label>
                    <div class="flex gap-3">
                        <button onclick="document.getElementById('inp-file').click()" class="flex-1 py-3 px-4 bg-white/70 backdrop-blur-sm text-gray-700 font-medium rounded-xl border border-white shadow-sm active:bg-gray-100 transition-all flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Choose File
                        </button>
                        <button onclick="document.getElementById('inp-camera').click()" class="flex-1 py-3 px-4 bg-white/70 backdrop-blur-sm text-gray-700 font-medium rounded-xl border border-white shadow-sm active:bg-gray-100 transition-all flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            Camera
                        </button>
                    </div>
                    <!-- Hidden file inputs -->
                    <input type="file" id="inp-file" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                    <input type="file" id="inp-camera" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event)">
                    <div id="img-preview-box" class="mt-3 hidden justify-center w-full h-32 bg-gray-50/50 rounded-xl overflow-hidden border border-white shadow-sm">
                        <img id="img-preview" src="" class="h-full object-cover">
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Assign Class</label>
                    <input type="text" id="inp-class" value="Class 4" class="w-full bg-white/70 backdrop-blur-sm border border-white shadow-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                </div>

                <div class="flex gap-3 mt-6">
                    <button onclick="goToStep(1)" class="w-1/3 bg-white/60 backdrop-blur-sm text-gray-800 font-semibold py-4 rounded-xl border border-white shadow-sm active:bg-gray-100 transition-all">
                        Back
                    </button>
                    <button onclick="finishRegistration()" class="w-2/3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold py-4 rounded-xl active:scale-[0.98] shadow-lg shadow-indigo-500/30 transition-all">
                        Finish
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="customModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl transform scale-95 transition-transform duration-300 border border-white" id="modalContent">
            <div id="modalTitle" class="text-indigo-600 font-bold text-lg mb-2 flex items-center space-x-2">
                <span>Notice</span>
            </div>
            <p id="modalMessage" class="text-slate-600 text-sm mb-6">Message content goes here.</p>
            <button onclick="hideModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-2xl transition duration-150">
                OK
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Glassmorphism Fixed) -->
    <div class="fixed bottom-0 left-0 w-full bg-white/50 backdrop-blur-xl border-t border-white/60 px-4 py-4 z-50 shadow-[0_-10px_30px_-5px_rgba(0,0,0,0.1)]">
        <div class="flex flex-row justify-center gap-3 w-full max-w-lg mx-auto">
            <button id="nav-class" onclick="switchNavTab('class')" class="flex-1 py-3 rounded-xl font-semibold tracking-wide transition-all shadow-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white border border-transparent">
                class
            </button>
            <button id="nav-attendance" onclick="switchNavTab('attendance')" class="flex-1 py-3 rounded-xl font-semibold tracking-wide transition-all bg-white/40 text-gray-600 border border-white/60 backdrop-blur-sm hover:bg-white/80">
                attendance
            </button>
            <button id="nav-new" onclick="switchNavTab('new')" class="flex-1 py-3 rounded-xl font-semibold tracking-wide transition-all bg-white/40 text-gray-600 border border-white/60 backdrop-blur-sm hover:bg-white/80">
                new
            </button>
        </div>
    </div>

    <script>
        // =========================================================================
        // 1 ቦታ አድርግ: ID ካርድ ማስተካከያ ቦታ (ID CARD CONFIGURATION)
        // እዚህ ጋር ብቻ መግባት ያለብዎት ይህኛው ነው! የጽሁፍ መጠን፣ ቀለም፣ የሄደበት ቦታ ሁሉ ከዚህ ይቆጣጠሩ።
        // =========================================================================
        const ID_LAYOUT = {
            // --- በላዩ ላይ የሚገኘው የቤተ ክርስቲያን ስም ---
            churchName: {
                fontSize: "13px",
                fontWeight: "800", 
                color: "#1e3a8a", 
                marginTop: "0px",
                marginBottom: "4px",
            },
            // --- የክፍል ስም (ወደ ቀኝ የሚሄደው) ---
            classNameText: {
                fontSize: "14px",
                fontWeight: "700",
                color: "#4f46e5", 
                marginTop: "0px",
                marginRight: "0px", 
            },
            // --- የመረጃዎች ክፍል (Full Name, Age, Phone, Sex) ---
            detailsText: {
                fontSize: "11px",
                fontWeight: "600",
                color: "#111827", 
                labelColor: "#6b7280", 
                labelWidth: "80px", 
                marginLeft: "0px",
                marginTop: "0px",
            },
            // --- የሰማንያ ምስል (Profile Picture) ---
            profilePic: {
                width: "96px", 
                height: "96px",
                borderRadius: "16px",
                border: "2px solid white",
                marginLeft: "0px", 
            },
            // --- QR ኮድ (አዲስ የስታይልing መጠን እዚህ ይቀየሩ) ---
            qrCode: {
                width: 120, 
                height: 120,
                bgColor: "transparent", 
                borderRadius: "8px",
                padding: "6px",
                marginRight: "0px", 
                dotsColor: "#000000",
                dotsType: "rounded",
                cornersSquareColor: "#33011e",
                cornersSquareType: "extra-rounded",
                cornersDotColor: "#33011e", // ለመረጃ ጥራት ቀለም ተጨምሯል
                cornersDotType: "dot"       // ለመረጃ ጥራት ቅርጽ ተጨምሯል
            },
            // --- የጀርባ ካርድ የአደጋ ጊዜ መልዕክት ---
            emergencyText: {
                fontSize: "11px",
                fontWeight: "600",
                color: "#111827",
                labelColor: "#6b7280",
                labelFontSize: "10px",
                marginTop: "0px",
                marginLeft: "0px", 
            }
        };
        // =========================================================================

        // Default pre-populated demo data including John Yemilewn
        const defaultDemoStudents = [
            {
                id: "STU-101",
                churchName: "St. Mary Orthodox Church",
                christName: "Gebre Michael",
                firstName: "John",
                lastName: "Yemilewn",
                age: "16",
                sex: "Male",
                phone: "+251 911 234 567",
                emerName: "Yemilewn Tesfaye",
                emerPhone: "+251 922 987 654",
                className: "Class 4",
                pic: "https://placehold.co/150x150/6366f1/ffffff?text=JY"
            },
            {
                id: "STU-102",
                churchName: "St. Mary Orthodox Church",
                christName: "Michael",
                firstName: "Benjamin",
                lastName: "Taylor",
                age: "13",
                sex: "Male",
                phone: "+251 911 888 777",
                emerName: "David Taylor",
                emerPhone: "+251 911 999 888",
                className: "Class 1",
                pic: "https://placehold.co/150x150/8b5cf6/ffffff?text=BT"
            },
            {
                id: "STU-201",
                churchName: "St. Mary Orthodox Church",
                christName: "Elizabeth",
                firstName: "Chloe",
                lastName: "Martinez",
                age: "14",
                sex: "Female",
                phone: "+251 933 111 222",
                emerName: "Maria Martinez",
                emerPhone: "+251 933 333 444",
                className: "Class 2",
                pic: "https://placehold.co/150x150/ec4899/ffffff?text=CM"
            },
            {
                id: "STU-301",
                churchName: "St. Mary Orthodox Church",
                christName: "Samuel",
                firstName: "Daniel",
                lastName: "Johnson",
                age: "15",
                sex: "Male",
                phone: "+251 944 555 666",
                emerName: "Mark Johnson",
                emerPhone: "+251 944 777 888",
                className: "Class 3",
                pic: "https://placehold.co/150x150/3b82f6/ffffff?text=DJ"
            }
        ];

        let students = JSON.parse(localStorage.getItem('churchStudents'));
        if (!students || students.length === 0) {
            students = defaultDemoStudents;
            localStorage.setItem('churchStudents', JSON.stringify(students));
        }

        let base64Image = null;

        const views = document.querySelectorAll('.app-view');
        const navBtns = {
            'class': document.getElementById('nav-class'),
            'attendance': document.getElementById('nav-attendance'),
            'new': document.getElementById('nav-new')
        };

        // Custom Safe Message Box (Avoiding window.alert)
        function showModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function hideModal() {
            const modal = document.getElementById('customModal');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 200);
        }

        // Initialize App
        function initApp() {
            generateClassButtons();
            switchNavTab('class'); 
            
            // Automatically open Class 1 and go straight to Benjamin Taylor's ID Page
            const targetStudent = students.find(s => s.firstName === "Benjamin" && s.lastName === "Taylor");
            if (targetStudent) {
                openClassStudents(1);      
                openStudentDetail(targetStudent.id); 
            }
        }

        function switchNavTab(tabName) {
            // Update Nav Styles with active/inactive states
            Object.keys(navBtns).forEach(key => {
                const btn = navBtns[key];
                if (key === tabName) {
                    btn.className = "flex-1 py-3 rounded-xl font-semibold tracking-wide transition-all shadow-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white border border-transparent";
                } else {
                    btn.className = "flex-1 py-3 rounded-xl font-semibold tracking-wide transition-all bg-white/40 text-gray-600 border border-white/60 backdrop-blur-sm hover:bg-white/80";
                }
            });

            // Show proper root view
            if (tabName === 'class') showView('class-root');
            if (tabName === 'attendance') showView('attendance-root');
            if (tabName === 'new') {
                showView('new-root');
                goToStep(1); 
            }
        }

        function showView(viewId) {
            views.forEach(v => v.classList.add('hidden'));
            const target = document.getElementById('view-' + viewId);
            if(target) {
                target.classList.remove('hidden');
                target.classList.add('fade-in');
            }
        }

        function generateClassButtons() {
            const classContainer = document.getElementById('class-buttons-container');
            const attContainer = document.getElementById('attendance-buttons-container');
            
            classContainer.innerHTML = '';
            attContainer.innerHTML = '';

            for (let i = 1; i <= 8; i++) {
                // For Class Tab
                const classBtn = document.createElement('button');
                classBtn.className = "w-full text-left px-5 py-4 rounded-2xl bg-white/70 backdrop-blur-md border border-white shadow-sm hover:shadow-md active:bg-gray-50 font-semibold text-gray-800 flex justify-between items-center transition-all";
                classBtn.innerHTML = `<span>Class ${i}</span> <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
                classBtn.onclick = () => openClassStudents(i);
                classContainer.appendChild(classBtn);

                // For Attendance Tab
                const attBtn = classBtn.cloneNode(true);
                attBtn.onclick = () => openAttendanceTable(i);
                attContainer.appendChild(attBtn);
            }
        }

        function openClassStudents(classNum) {
            document.getElementById('class-list-title').innerText = `Class ${classNum}`;
            const container = document.getElementById('class-students-container');
            container.innerHTML = '';

            const classStudents = students.filter(s => getCleanClassNumber(s.className) == classNum);

            if (classStudents.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-10 bg-white/50 rounded-2xl border border-white/60">No students found in this class.</p>`;
            } else {
                classStudents.forEach(student => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-4 py-4 rounded-2xl bg-white/60 backdrop-blur-md border border-white shadow-sm active:bg-gray-100 font-medium text-gray-800 flex items-center gap-3 transition-all";
                    
                    let avatar = `<div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-sm shrink-0">${student.firstName.charAt(0)}</div>`;
                    if (student.pic) avatar = `<img src="${student.pic}" class="w-10 h-10 rounded-full object-cover shrink-0" onerror="this.src='https://placehold.co/100x100/6366f1/ffffff?text=${student.firstName.charAt(0)}'">`;

                    btn.innerHTML = `${avatar} <span class="font-semibold">${student.firstName} ${student.lastName}</span>`;
                    btn.onclick = () => openStudentDetail(student.id);
                    container.appendChild(btn);
                });
            }
            showView('class-list');
        }

        function openStudentDetail(id) {
            const student = students.find(s => s.id === id);
            if (!student) return;

            const card = document.getElementById('student-id-card');
            
            // Profile picture HTML generation
            let img = `<div style="width: ${ID_LAYOUT.profilePic.width}; height: ${ID_LAYOUT.profilePic.height}; border-radius: ${ID_LAYOUT.profilePic.borderRadius}; border: ${ID_LAYOUT.profilePic.border}; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); background-color: #e5e7eb; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 2rem; color: #6b7280; margin-left: ${ID_LAYOUT.profilePic.marginLeft};">${student.firstName.charAt(0)}</div>`;
            
            if (student.pic) {
                img = `<img src="${student.pic}" style="width: ${ID_LAYOUT.profilePic.width}; height: ${ID_LAYOUT.profilePic.height}; border-radius: ${ID_LAYOUT.profilePic.borderRadius}; border: ${ID_LAYOUT.profilePic.border}; object-fit: cover; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-left: ${ID_LAYOUT.profilePic.marginLeft};" onerror="this.src='https://placehold.co/150x150/e2e8f0/64748b?text=${student.firstName.charAt(0)}'">`;
            }

            // Data to encode in QR
            const qrData = `ID: ${student.id}\nName: ${student.firstName} ${student.lastName}\nClass: ${student.className}\nPhone: ${student.phone || 'N/A'}`;

            card.innerHTML = `
                <h3 class="text-xl font-bold text-gray-900 mb-1">${student.firstName} ${student.lastName}</h3>
                <p class="text-gray-500 font-medium mb-1">${student.churchName || 'Church Member'}</p>
                <p class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full mb-6 font-mono font-semibold">ID: ${student.id}</p>
                
                <div class="w-full flex flex-col items-center gap-8 mt-4">
                    
                    <!-- ID FRONT CARD IMAGE BACKGROUND -->
                    <div class="relative w-full max-w-sm rounded-2xl overflow-hidden shadow-xl border border-gray-200 bg-gray-100">
                        <img src="idfront.png" alt="ID Front Background" class="w-full h-auto block" onerror="this.onerror=null;this.src='https://placehold.co/400x250/e2e8f0/64748b?text=idfront.png+Not+Found';">
                        
                        <div class="absolute inset-0 flex flex-col p-4 gap-2">
                            <!-- Top Header: Church Name & Class -->
                            <div class="text-center px-4">
                                <h4 style="font-size: ${ID_LAYOUT.churchName.fontSize}; font-weight: ${ID_LAYOUT.churchName.fontWeight}; color: ${ID_LAYOUT.churchName.color}; margin-top: ${ID_LAYOUT.churchName.marginTop}; margin-bottom: ${ID_LAYOUT.churchName.marginBottom}; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.2;">Mekane semaet K/Estifanos Betekrstiyan fre Haymanot S/T/Bet</h4>
                                <p style="font-size: ${ID_LAYOUT.classNameText.fontSize}; font-weight: ${ID_LAYOUT.classNameText.fontWeight}; color: ${ID_LAYOUT.classNameText.color}; margin-top: ${ID_LAYOUT.classNameText.marginTop}; margin-right: ${ID_LAYOUT.classNameText.marginRight}; text-align: right; text-transform: capitalize;">${student.className}</p>
                            </div>
                            
                            <!-- Bottom Content: Photo & Info -->
                            <div class="flex-1 flex items-center justify-center p-2 gap-4 mt-2">
                                <!-- Left Center: Profile Photo -->
                                <div class="shrink-0">
                                    ${img}
                                </div>
                                <!-- Right Center: Info -->
                                <div style="font-size: ${ID_LAYOUT.detailsText.fontSize}; font-weight: ${ID_LAYOUT.detailsText.fontWeight}; color: ${ID_LAYOUT.detailsText.color}; margin-left: ${ID_LAYOUT.detailsText.marginLeft}; margin-top: ${ID_LAYOUT.detailsText.marginTop}; padding: 8px; flex: 1; line-height: 1.5;">
                                    <div style="display: flex; margin-bottom: 4px;"><span style="width: ${ID_LAYOUT.detailsText.labelWidth}; color: ${ID_LAYOUT.detailsText.labelColor};">Full Name :</span> <span>${student.firstName} ${student.lastName}</span></div>
                                    <div style="display: flex; margin-bottom: 4px;"><span style="width: ${ID_LAYOUT.detailsText.labelWidth}; color: ${ID_LAYOUT.detailsText.labelColor};">Age :</span> <span>${student.age || 'N/A'}</span></div>
                                    <div style="display: flex; margin-bottom: 4px;"><span style="width: ${ID_LAYOUT.detailsText.labelWidth}; color: ${ID_LAYOUT.detailsText.labelColor};">Phone :</span> <span>${student.phone || 'N/A'}</span></div>
                                    <div style="display: flex;"><span style="width: ${ID_LAYOUT.detailsText.labelWidth}; color: ${ID_LAYOUT.detailsText.labelColor};">Sex :</span> <span>${student.sex || 'N/A'}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- ID BACK CARD IMAGE BACKGROUND -->
                    <div class="relative w-full max-w-sm rounded-2xl overflow-hidden shadow-xl border border-gray-200 bg-gray-100">
                        <img src="idback.png" alt="ID Back Background" class="w-full h-auto block" onerror="this.onerror=null;this.src='https://placehold.co/400x250/e2e8f0/64748b?text=idback.png+Not+Found';">
                        
                        <div class="absolute inset-0 flex items-center justify-between p-6 gap-4">
                            <!-- Left Side: Emergency Info -->
                            <div style="font-size: ${ID_LAYOUT.emergencyText.fontSize}; font-weight: ${ID_LAYOUT.emergencyText.fontWeight}; color: ${ID_LAYOUT.emergencyText.color}; margin-top: ${ID_LAYOUT.emergencyText.marginTop}; margin-left: ${ID_LAYOUT.emergencyText.marginLeft}; padding: 8px; flex: 1; line-height: 1.5;">
                                <div style="display: flex; flex-direction: column; margin-bottom: 12px;">
                                    <span style="color: ${ID_LAYOUT.emergencyText.labelColor}; font-size: ${ID_LAYOUT.emergencyText.labelFontSize}; text-transform: uppercase; letter-spacing: 0.05em;">Emergency Name :</span>
                                    <span>${student.emerName || 'N/A'}</span>
                                </div>
                                <div style="display: flex; flex-direction: column;">
                                    <span style="color: ${ID_LAYOUT.emergencyText.labelColor}; font-size: ${ID_LAYOUT.emergencyText.labelFontSize}; text-transform: uppercase; letter-spacing: 0.05em;">Phone :</span>
                                    <span>${student.emerPhone || 'N/A'}</span>
                                </div>
                            </div>
                            <!-- Right Side Center: QR Code Container -->
                            <div id="qr-code-container" style="background-color: ${ID_LAYOUT.qrCode.bgColor}; padding: ${ID_LAYOUT.qrCode.padding}; border-radius: ${ID_LAYOUT.qrCode.borderRadius}; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; margin-right: ${ID_LAYOUT.qrCode.marginRight}; width: ${ID_LAYOUT.qrCode.width}px; height: ${ID_LAYOUT.qrCode.height}px;"></div>
                        </div>
                    </div>

                </div>
            `;

            // Generate and append the new styled QR Code
            // type: "svg" ተጠቅመናል የጥራት ችግር (Zoom ሲደረግ የሚታየው) በአጭሩ እንዲፈታ!
            const qrCode = new QRCodeStyling({
                width: ID_LAYOUT.qrCode.width,
                height: ID_LAYOUT.qrCode.height,
                type: "svg", // <--- እዚህ ነው ለውጡ! (ጥራቱ እንዳይቀንስ)
                data: qrData,
                image: "",
                dotsOptions: {
                    color: ID_LAYOUT.qrCode.dotsColor,
                    type: ID_LAYOUT.qrCode.dotsType
                },
                cornersSquareOptions: {
                    color: ID_LAYOUT.qrCode.cornersSquareColor,
                    type: ID_LAYOUT.qrCode.cornersSquareType
                },
                cornersDotOptions: { // <--- ይህም ተጨምሯል ጥጎች ለመረጃ ጥራት
                    color: ID_LAYOUT.qrCode.cornersDotColor,
                    type: ID_LAYOUT.qrCode.cornersDotType
                },
                backgroundOptions: {
                    color: ID_LAYOUT.qrCode.bgColor
                },
                imageOptions: {
                    crossOrigin: "anonymous",
                    margin: 6
                }
            });

            const qrContainer = document.getElementById("qr-code-container");
            if (qrContainer) {
                qrContainer.innerHTML = ""; // Clear previous if any
                qrCode.append(qrContainer);
            }

            showView('student-detail');
        }

        function openAttendanceTable(classNum) {
            document.getElementById('attendance-list-title').innerText = `Class ${classNum} Attendance`;
            const tbody = document.getElementById('attendance-table-body');
            tbody.innerHTML = '';

            const classStudents = students
                .filter(s => getCleanClassNumber(s.className) == classNum)
                .sort((a, b) => a.firstName.localeCompare(b.firstName));

            if (classStudents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="py-8 text-center text-gray-400">No students registered in this class.</td></tr>`;
            } else {
                classStudents.forEach(student => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-white/60 transition-colors";
                    
                    let avatar = `<div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">${student.firstName.charAt(0)}</div>`;
                    if (student.pic) avatar = `<img src="${student.pic}" class="w-8 h-8 rounded-full object-cover shrink-0" onerror="this.src='https://placehold.co/100x100/6366f1/ffffff?text=${student.firstName.charAt(0)}'">`;

                    tr.innerHTML = `
                        <td class="py-4 px-4 font-medium text-gray-800 flex items-center gap-3">
                            ${avatar}
                            <span>${student.firstName} ${student.lastName}</span>
                        </td>
                        <td class="py-4 px-4 text-center">
                            <input type="checkbox" class="w-6 h-6 rounded-md border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer accent-indigo-600">
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            showView('attendance-list');
        }

        function goToStep(step) {
            if (step === 1) {
                document.getElementById('form-step-1').classList.remove('hidden');
                document.getElementById('form-step-2').classList.add('hidden');
            } else {
                const first = document.getElementById('inp-first').value.trim();
                if (!first) {
                    showModal('Validation Error', 'First name is required before proceeding.');
                    return;
                }
                document.getElementById('form-step-1').classList.add('hidden');
                document.getElementById('form-step-2').classList.remove('hidden');
            }
        }

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                base64Image = e.target.result;
                document.getElementById('img-preview').src = base64Image;
                document.getElementById('img-preview-box').classList.remove('hidden');
                document.getElementById('img-preview-box').classList.add('flex');
            };
            reader.readAsDataURL(file);
        }

        function finishRegistration() {
            const cClass = document.getElementById('inp-class').value.trim();
            if (!cClass) {
                showModal('Validation Error', 'Please assign a class (e.g. Class 1 through Class 8).');
                return;
            }

            const randomId = 'STU-' + Math.floor(1000 + Math.random() * 9000);

            const student = {
                id: randomId,
                churchName: document.getElementById('inp-church').value.trim(),
                christName: document.getElementById('inp-christ').value.trim(),
                firstName: document.getElementById('inp-first').value.trim(),
                lastName: document.getElementById('inp-last').value.trim(),
                age: document.getElementById('inp-age').value.trim(),
                sex: document.getElementById('inp-sex').value,
                phone: document.getElementById('inp-phone').value.trim(),
                emerName: document.getElementById('inp-emer-name').value.trim(),
                emerPhone: document.getElementById('inp-emer-phone').value.trim(),
                className: cClass,
                pic: base64Image
            };

            students.push(student);
            localStorage.setItem('churchStudents', JSON.stringify(students));
            
            showModal('Registration Successful', `Student ${student.firstName} has been saved successfully with ID: ${student.id}`);
            
            base64Image = null;
            document.getElementById('img-preview-box').classList.add('hidden');
            document.getElementById('img-preview-box').classList.remove('flex');
            document.getElementById('img-preview').src = '';
            
            goToStep(1);
            switchNavTab('class');
        }

        // Helper to extract clean number from class string (e.g. "Class 3" -> 3)
        function getCleanClassNumber(str) {
            if(!str) return "";
            return str.toLowerCase().replace(/[^0-9]/g, '');
        }

        // Initialize application on load
        initApp();
    </script>
</body>
</html>
